<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NutriGuide — Socket.io Chat Demo (L45-48)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { color: #4ade80; font-size: 18px; }
    #online { font-size: 12px; color: #94a3b8; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
    .msg.mine { align-self: flex-end; background: #16a34a; color: white; border-bottom-right-radius: 2px; }
    .msg.theirs { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 2px; }
    .msg .sender { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
    .msg .time { font-size: 10px; opacity: 0.6; margin-top: 2px; text-align: right; }
    #typing-indicator { padding: 4px 16px; font-size: 12px; color: #64748b; min-height: 20px; }
    footer { background: #1e293b; padding: 12px 16px; display: flex; gap: 8px; }
    footer input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; }
    footer button { padding: 10px 20px; background: #16a34a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    footer button:disabled { opacity: 0.5; }
    .status { padding: 8px 16px; background: #1e3a2e; font-size: 12px; color: #4ade80; text-align: center; }
    .status.err { background: #3a1e1e; color: #f87171; }
  </style>
</head>
<body>

<header>
  <h1>🥗 NutriGuide — Live Chat (Socket.io Demo)</h1>
  <span id="online">● 0 online</span>
</header>

<div id="status-bar" class="status">Connecting...</div>

<div id="messages">
  <div class="msg theirs">
    <div class="sender">NutriBot</div>
    👋 Welcome to the Socket.io demo! This page demonstrates full-duplex communication (L45-48).
    <div class="time">just now</div>
  </div>
</div>

<div id="typing-indicator"></div>

<footer>
  <input id="username-input" type="text" placeholder="Your name" value="Guest" style="max-width:120px" />
  <input id="msg-input" type="text" placeholder="Type a message..." maxlength="500" />
  <button id="send-btn" disabled>Send</button>
</footer>

<!-- Socket.io client library — served automatically by our server -->
<script src="/socket.io/socket.io.js"></script>
<script>
  // ── L45-48: Connecting to the server ──────────────────────────────────────
  const socket = io({
    // auth: { token: "your_jwt_here" }  // ← pass JWT for authenticated connections
  });

  const messagesEl = document.getElementById("messages");
  const msgInput   = document.getElementById("msg-input");
  const sendBtn    = document.getElementById("send-btn");
  const onlineEl   = document.getElementById("online");
  const statusEl   = document.getElementById("status-bar");
  const typingEl   = document.getElementById("typing-indicator");
  const usernameEl = document.getElementById("username-input");

  let typingTimer;

  // ── L45-48: Listening to events from the server ───────────────────────────
  socket.on("connect", () => {
    statusEl.textContent = "✅ Connected — socket ID: " + socket.id;
    statusEl.className = "status";
    sendBtn.disabled = false;
    addMessage("System", "You are connected (ID: " + socket.id + ")", "theirs");
  });

  socket.on("disconnect", () => {
    statusEl.textContent = "❌ Disconnected — trying to reconnect...";
    statusEl.className = "status err";
    sendBtn.disabled = true;
  });

  // ── L45-48: Server pushes a message to ALL clients in the room ────────────
  socket.on("chat:message", (msg) => {
    const isMe = msg.userId === socket.id;
    addMessage(msg.username, msg.content, isMe ? "mine" : "theirs", msg.createdAt);
  });

  // ── L45-48: Server pushes online count ───────────────────────────────────
  socket.on("user:count", (n) => {
    onlineEl.textContent = `● ${n} online`;
  });

  socket.on("chat:typing", (username) => {
    typingEl.textContent = `${username} is typing...`;
  });

  socket.on("chat:stop-typing", () => {
    typingEl.textContent = "";
  });

  // ── L45-48: Emitting events TO the server ─────────────────────────────────
  function sendMessage() {
    const content = msgInput.value.trim();
    if (!content) return;
    // socket.emit(eventName, data) — full-duplex: client pushing to server
    socket.emit("chat:message", {
      username: usernameEl.value || "Guest",
      content,
    });
    msgInput.value = "";
    socket.emit("chat:stop-typing");
  }

  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") return sendMessage();
    // Typing indicator
    socket.emit("chat:typing", usernameEl.value || "Guest");
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket.emit("chat:stop-typing"), 1500);
  });

  function addMessage(sender, text, cls, time) {
    const el = document.createElement("div");
    el.className = `msg ${cls}`;
    el.innerHTML = `
      <div class="sender">${sender}</div>
      ${text}
      <div class="time">${time ? new Date(time).toLocaleTimeString() : "just now"}</div>
    `;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
</script>
</body>
</html>
